# ---------------------------------------------------------------------------
# Local / demo broker configuration for Docker Compose.
# Anonymous access is convenient for a classroom demo but NOT safe on the
# public internet. For production:
#   1. create a password file:
#        docker run --rm -it -v "$PWD/mosquitto:/mosquitto/config" \
#          eclipse-mosquitto:2 mosquitto_passwd -c /mosquitto/config/passwd smartstudy
#   2. set allow_anonymous false
#   3. enable a per-device ACL (device may only use smartstudy/<DEVICE_CODE>/#)
#   4. expose 8883 with TLS instead of 1883
# ---------------------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt

# WebSocket listener (useful for browser dashboards; the RN app uses REST/WS
# through FastAPI, not MQTT directly).
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
connection_messages true
